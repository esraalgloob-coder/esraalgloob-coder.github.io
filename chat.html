<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial;
    background:#000;
    color:red;
    overflow:hidden;
}

/* ===== CHAT AREA ===== */
.chat{
    height:90vh;
    overflow-y:auto;
    overflow-x:hidden;

    padding:10px;

    display:flex;
    flex-direction:column;
    gap:10px;

    scroll-behavior:smooth;
}

/* ===== MESSAGE ===== */
.msg{
    max-width:86%;
    padding:12px 14px;
    border-radius:14px;

    overflow:hidden;

    animation:fade .2s ease-in-out;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(5px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* USER */
.user{
    background:#0ff;
    color:orange;

    margin-left:auto;

    box-shadow:1px 1px 1px 1px red;
}

/* AI */
.ai{
    background:#000;
    margin-right:auto;
}

/* ===== CODE BLOCK ===== */
.code-wrapper{
    position:relative;

    background:#000;

    border-radius:10px;

    padding-top:40px;

    max-width:500px;
    max-height:400px;

    overflow:auto;

    white-space:nowrap;

    border:1px solid red;
}

/* ===== CODE ===== */
pre{
    margin:0;
    padding:15px;

    font-family:monospace;
    font-size:14px;
    line-height:1.5;

    white-space:pre;

    display:inline-block;

    min-width:max-content;

    overflow:visible;

    background:linear-gradient(
        red,
        aqua,
        pink,
        orange,
        brown
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

/* ===== SCROLLBAR ===== */
.code-wrapper::-webkit-scrollbar{
    width:8px;
    height:8px;
}

.code-wrapper::-webkit-scrollbar-thumb{
    background:linear-gradient(
        red,
        aqua,
        pink,
        orange,
        brown
    );
    border-radius:10px;
}

.code-wrapper::-webkit-scrollbar-track{
    background:#111;
}

.chat::-webkit-scrollbar{
    width:8px;
}

.chat::-webkit-scrollbar-thumb{
    background:red;
    border-radius:10px;
}

.chat::-webkit-scrollbar-track{
    background:#111;
}

/* ===== COPY BUTTON ===== */
.copy-btn{
    position:absolute;

    top:5px;
    right:5px;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:5px;

    height:30px;

    padding:5px 10px;

    border:none;
    border-radius:8px;

    background:#000;

    color:white;

    cursor:pointer;

    z-index:999;
}

.copy-btn:hover{
    background:#111;
}

/* ===== INPUT AREA ===== */
.inputBox{
    display:flex;

    padding:10px;

    background:#000;

    box-shadow:1px 1px 1px 1px red;
}

/* ===== INPUT ===== */
input{
    flex:1;

    padding:12px;

    font-size:16px;

    color:white;

    background:#000;

    border:none;
    outline:none;

    border-radius:10px;

    box-shadow:1px 1px 1px 1px red;
}

input::placeholder{
    color:orangered;
}

/* ===== BUTTON ===== */
button{
    padding:12px 16px;

    margin-right:10px;

    border:none;
    border-radius:10px;

    background:#000;

    color:white;

    cursor:pointer;

    box-shadow:1px 1px 1px 1px red;
}

/* ===== LIST ===== */
.list{
    position:fixed;

    top:10px;
    right:100px;

    width:90%;

    max-height:150px;

    overflow-y:auto;

    display:none;

    background:#111;

    border-radius:10px;

/* ===== ITEM ===== */
.item{
    padding:10px;

    color:white;

    cursor:pointer;

    transition:.3s;
}

.item:hover{
    background:linear-gradient(
        45deg,
        #ff00cc,
        #3333ff
    );
}

/* ===== TITLE ===== */
.title{
    position:sticky;

    top:1px;
    right:100px;
}

/* ===== BOX ===== */
.box{
    position:relative;

    width:500px;
    height:200px;

    margin:50px auto;

    border:5px solid;

    animation:borderColor 3s infinite;
}

@keyframes borderColor{
    0%{
        text-shadow:1px 1px red;
    }

    25%{
        text-shadow:1px 1px blue;
    }

    50%{
        text-shadow:1px 1px green;
    }

    75%{
        text-shadow:1px 1px yellow;
    }

    100%{
        text-shadow:1px 1px red;
    }
}

/* ===== FIELDS ===== */
.fields{
    color:green;
}

<script>

let input = document.getElementById("input");
let list = document.getElementById("list");
let items = document.querySelectorAll(".item");

/* البحث */
input.addEventListener("input", () => {

  let value = input.value;

  // 🔥 نأخذ آخر كلمة بعد المسافة
  let lastWord = value.split(" ").pop().trim().toLowerCase();

  let found = false;

  items.forEach(item => {
    let text = item.innerText.toLowerCase();

    if(text.includes(lastWord)){
      item.style.display = "block";
      found = true;
    }else{
      item.style.display = "none";
    }
  });

  list.style.display = lastWord ? (found ? "block" : "none") : "none";
});

/* اختيار */
items.forEach(item => {
  item.addEventListener("click", () => {

    let value = input.value;

    // تقسيم بالكلمات
    let parts = value.split(" ");

    // حذف آخر كلمة
    parts.pop();

    // إضافة الكلمة المختارة
    parts.push(item.innerText);

    // دمج مع مسافة
    input.value = parts.join(" ") + " ";

    list.style.display = "none";
    input.focus();
  });
});

/* إخفاء */
input.addEventListener("blur", () => {
  setTimeout(() => list.style.display = "none", 200);
});

/* إظهار */
input.addEventListener("focus", () => {
  list.style.display = "block";
});

</script>

import android.content.ContentValues;
import android.content.Context;
import android.database.Cursor;
import android.database.sqlite.*;
public class DatabaseHelper extends SQLiteOpenHelper {
   String[] fields = {${fields.map((f,i) => `"${f}"`).join(",")}};
   public DatabaseHelper(Context c){
   super(c,"app.db",null,1);
}
@Override
public void onCreate(SQLiteDatabase db){
   StringBuilder create = new StringBuilder();
   create.append("CREATE TABLE data(");
   create.append("id INTEGER PRIMARY KEY AUTOINCREMENT,");
for(int i=0;i<fields.length;i++){
   create.append(fields[i]).append(" TEXT");
if(i != fields.length-1){
    create.append(",");
   }
}
   create.append(")");
   db.execSQL(create.toString());
}
@Override
public void onUpgrade(SQLiteDatabase db,int o,int n){
   db.execSQL("DROP TABLE IF EXISTS data");
   onCreate(db);
}
// insert
public void insert(String... values){
   SQLiteDatabase db = this.getWritableDatabase();
   ContentValues cv = new ContentValues();
for(int i=0;i<fields.length;i++){
   cv.put(fields[i], values[i]);
}
   db.insert("data",null,cv);
}
// delete
public void delete(String id){
   getWritableDatabase().delete("data","id=?",new String[]{id});
}
// update
public void update(String id, String... values){
   ContentValues cv = new ContentValues();
for(int i=0;i<fields.length;i++){
   cv.put(fields[i], values[i]);
}
   getWritableDatabase().update("data",cv,"id=?",new String[]{id});
}
// search 
public Cursor search(String text){
   SQLiteDatabase db = this.getReadableDatabase();
if(text == null || text.isEmpty()){
   return db.rawQuery("SELECT * FROM data", null);
}
   StringBuilder query = new StringBuilder("SELECT * FROM data WHERE ");
for(int i=0;i<fields.length;i++){
   query.append(fields[i]).append(" LIKE ?");
if(i != fields.length-1){
   query.append(" OR ");
   }
}
   String[] args = new String[fields.length];
for(int i=0;i<fields.length;i++){
   args[i] = "%" + text + "%";
}
   return db.rawQuery(query.toString(), args);
   }
}

    if(!text) return;

    addMessage(extractEnglishFields(text), "user");

    let code = generateCode(text);

    addMessage(code, "ai");

    input.value = "";

function extractEnglishFields(text){

    // نحول النص إلى كلمات
    let words = text.split(/\s+/);

    let fields = [];

    words.forEach(w => {

        // 🔴 تجاهل أي كلمة عربية (Unicode)
        if(/[\u0600-\u06FF]/.test(w)) return;

        // 🔴 تجاهل الكلمات العامة
        if([
        "database","table","android","create","make","build","code","php","and",",","page","for"
        ,"html","with","fields",
        "insert","delete","java"
        
        ].includes(w.toLowerCase())) return;

        // ✔ فقط الكلمات الإنجليزية
        if(/^[a-zA-Z]+$/.test(w)){
            fields.push(w.toLowerCase());
        }
    })
return [...new Set(fields)];
}
