<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سبورة احترافية - ألوان القلم والخلفية</title>
<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  flex-direction:column;
  background:#8b0000;
  font-family:Tahoma;
  overflow:hidden;
}

.toolbar{
  display:flex;
  align-items:center;
  padding:4px;
  background:indianred;
  gap:4px;
  justify-content:flex-start;
  position:relative;
}

.tool{
  width:36px;
  height:36px;
  display:flex;
  justify-content:center;
  align-items:center;
  border-radius:6px;
  cursor:pointer;
  background:none;
  transition:0.3s;
}

.tool:hover{background:indianred; color:white;}

/* لوحة الألوان العائمة */
.color-palette{
  position:absolute;
  top:45px;
  display:flex;
  flex-wrap:wrap;
  gap:4px;
  background:lightcoral;
  padding:6px;
  border-radius:8px;
  display:none;
  z-index:100;
  width:95%;
}

/* ألوان القلم */
.color-palette .color{
  width:28px;
  height:28px;
  border-radius:50%;
  cursor:pointer;
  border:1px solid #fff;
}

/* ألوان الخلفية */
.color-palette .bg-color{
  width:28px;
  height:28px;
  border-radius:4px;
  cursor:pointer;
  border:1px solid #fff;
  box-shadow: inset 0 0 2px #000;
}

.canvas-container{
  flex:1;
  position:relative;
}

canvas{
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
}

/* Slider حجم الخط */
.size-slider{
  display:flex;
  align-items:center;
  gap:3px;
}

.size-slider svg{
  width:20px;
  height:20px;
  cursor:pointer;
  fill:white;
  transition:0.3s;
}

.size-slider svg:hover{fill:lightcoral;}

/* الختم SVG */
.stamp-svg{
  position:fixed;
  bottom:10px;
  right:10px;
  width:90px;
  height:90px;
  pointer-events:none;
}
</style>
</head>
<body>

<div class="toolbar">
  <!-- زر اللون الرئيسي -->
  <div class="tool" id="mainColorBtn" onclick="togglePalette()">⚫</div>

  <!-- لوحة الألوان العائمة -->
  <div class="color-palette" id="colorPalette">
       <div class="color" style="background:black;" onclick="setColor('black')"></div>
    <div class="color" style="background:red;" onclick="setColor('red')"></div>
    <div class="color" style="background:blue;" onclick="setColor('blue')"></div>
    <div class="color" style="background:green;" onclick="setColor('green')"></div>
    <div class="color" style="background:orange;" onclick="setColor('orange')"></div>
    <div class="color" style="background:purple;" onclick="setColor('purple')"></div>

    <br> <div class="bg-color" style="background:white;" onclick="setBackground('white')"></div>
    <div class="bg-color" style="background:#f7f7f7;" onclick="setBackground('#f7f7f7')"></div>
    <div class="bg-color" style="background:#ffe4e1;" onclick="setBackground('#ffe4e1')"></div>
    <div class="bg-color" style="background:#d3f4ff;" onclick="setBackground('#d3f4ff')"></div>
    <div class="bg-color" style="background:#ffffcc;" onclick="setBackground('#ffffcc')"></div>
       <div class="bg-color" style="background:#000000;" onclick="setBackground('#000000')"></div>

  </div>

  <!-- ممحاة -->
  <div class="tool" onclick="eraser()">🧽</div>

  <!-- مسح اللوحة -->
  <div class="tool" onclick="clearBoard()">🗑</div>

  <!-- حفظ PNG -->
  <div class="tool" onclick="savePNG()">💾</div>

  <!-- حجم الخط -->
  <div class="size-slider">
    <svg onclick="size=2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/></svg>
    <svg onclick="size=4" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/></svg>
    <svg onclick="size=8" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg>
    <svg onclick="size=12" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12"/></svg>
    <svg onclick="size=16" viewBox="0 0 24 24"><circle cx="12" cy="12" r="16"/></svg>
  </div>
</div>

<div class="canvas-container">
  <canvas id="board"></canvas>

  <!-- الختم -->
  <svg class="stamp-svg" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="48" stroke="indianred" stroke-width="4" fill="none"/>
    <text x="50" y="55" font-size="22" text-anchor="middle" fill="indianred" font-family="Tahoma">نبع التناسي</text>
  </svg>
</div>

<script>
const canvas=document.getElementById("board");
const ctx=canvas.getContext("2d");
let drawing=false;
let color="black";
let size=4;
let bgColor="white";

/* ===== إعداد متجاوب ===== */
function resize(){
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight - document.querySelector(".toolbar").offsetHeight;
  drawBackground();
}
resize();
window.addEventListener("resize",resize);

function getPointerPos(e){
  const rect=canvas.getBoundingClientRect();
  const x=e.touches ? e.touches[0].clientX - rect.left : e.clientX - rect.left;
  const y=e.touches ? e.touches[0].clientY - rect.top : e.clientY - rect.top;
  return {x,y};
}

/* ===== الرسم ===== */
canvas.addEventListener("pointerdown",()=>drawing=true);
canvas.addEventListener("pointerup",()=>{drawing=false;ctx.beginPath();});
canvas.addEventListener("pointermove",(e)=>{
  if(!drawing) return;
  const pos=getPointerPos(e);
  ctx.lineWidth=size;
  ctx.lineCap="round";
  ctx.strokeStyle=color;
  ctx.lineTo(pos.x,pos.y);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(pos.x,pos.y);
});

/* ===== الوظائف ===== */
function setColor(c){ 
  color=c; 
  document.getElementById("mainColorBtn").style.background=c; // تحديث الزر
  togglePalette(false);
}
function eraser(){color=bgColor;}
function clearBoard(){drawBackground();}
function setBackground(c){bgColor=c; drawBackground();}
function drawBackground(){
  ctx.fillStyle=bgColor;
  ctx.fillRect(0,0,canvas.width,canvas.height);
}

function savePNG(){
  const link=document.createElement("a");
  link.download="board.png";
  const tempCanvas=document.createElement("canvas");
  tempCanvas.width=canvas.width;
  tempCanvas.height=canvas.height;
  const tempCtx=tempCanvas.getContext("2d");
  tempCtx.drawImage(canvas,0,0);

  const stamp=document.querySelector(".stamp-svg");
  const svgData=new XMLSerializer().serializeToString(stamp);
  const img=new Image();
  img.src='data:image/svg+xml;base64,'+btoa(svgData);
  img.onload=function(){
    tempCtx.drawImage(img,canvas.width-140,canvas.height-140,120,120);
    link.href=tempCanvas.toDataURL();
    link.click();
  }
}

/* ===== لوحة الألوان العائمة ===== */
const palette=document.getElementById("colorPalette");
function togglePalette(show){
  if(show===false){palette.style.display='none'; return;}
  palette.style.display = palette.style.display==='flex' ? 'none' : 'flex';
}
</script>

</body>
</html>
